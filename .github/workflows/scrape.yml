name: Scrape prices

on:
  schedule:
    - cron: "0 17,23,5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scrape
        env:
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
        run: python scraper.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "shelf-check-bot"
          git config user.email "shelf-check-bot@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
