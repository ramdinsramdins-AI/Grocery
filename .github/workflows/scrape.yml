name: Scrape prices

on:
  schedule:
    # GitHub cron runs in UTC. These are 6am, 12pm and 6pm New Zealand daylight time (UTC+13).
    # In winter (UTC+12) they land an hour earlier, which does not matter for prices.
    - cron: "0 17,23,5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scrape
        env:
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
        run: python scraper.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "shelf-check-bot"
          git config user.email "shelf-check-bot@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          rm -rf /tmp/newdata && cp -r docs/data /tmp/newdata
          git reset -q
          git fetch origin main
          git reset -q --hard origin/main
          mkdir -p docs/data
          cp -r /tmp/newdata/. docs/data/
          git add -A docs/data
          git diff --cached --quiet && echo "Nothing new after sync" && exit 0
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
